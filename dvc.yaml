# Pipeline do projeto. Cada estágio declara o comando (cmd), o que ele lê (deps),
# os parâmetros do params.yaml que usa (params) e o que ele gera (outs).
stages:
  prepare:
    cmd: python src/prepare.py
    deps:
    - src/prepare.py
    - src/bike.py
    - data/raw/bike.csv
    outs:
    - data/prepared

  split:
    cmd: python src/split.py
    deps:
    - src/split.py
    - src/bike.py
    - data/prepared
    params:
    - split
    outs:
    - data/split

  train:
    cmd: python src/train.py
    deps:
    - src/train.py
    - src/bike.py
    - data/split/train.csv
    params:
    - train
    - mlflow
    outs:
    - models
    metrics:
    - metrics_val.json:   # validação temporal: use para comparar hiperparâmetros
        cache: false

  evaluate:
    cmd: python src/evaluate.py
    deps:
    - src/evaluate.py
    - src/bike.py
    - models
    - data/split/test.csv
    metrics:
    - metrics.json:
        cache: false

  plot:
    cmd: python src/plot.py
    deps:
    - src/plot.py
    - src/bike.py
    - models
    - data/split/test.csv
    plots:
    - reports/previsto_vs_real.png:
        cache: false

  compare:
    cmd: python src/compare_models.py
    deps:
    - src/compare_models.py
    - src/bike.py
    - models
    - data/split/test.csv
    params:
    - compare
    metrics:
    - reports/comparacao.json:
        cache: false
    # O @champion vive no Model Registry, fora do controle do DVC: sem isto, uma
    # promoção ou rollback não faria o DVC perceber que a comparação ficou velha.
    always_changed: true
